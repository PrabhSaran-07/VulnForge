services:
  postgres:
    image: postgres:16-alpine
    container_name: vulnforge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: vulnforge
      POSTGRES_USER: vulnforge
      POSTGRES_PASSWORD: vulnforge_password
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    container_name: vulnforge-backend
    depends_on:
      - postgres
    environment:
      NODE_ENV: development
      PORT: 4000
      DATABASE_URL: postgresql://vulnforge:vulnforge_password@postgres:5432/vulnforge?schema=public
      CORS_ORIGIN: http://localhost:5173
    ports:
      - '4000:4000'
    volumes:
      - ./backend:/app
      - /app/node_modules

  frontend:
    build:
      context: ./frontend
    container_name: vulnforge-frontend
    depends_on:
      - backend
    environment:
      VITE_API_URL: http://localhost:4000
    ports:
      - '5173:5173'
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  postgres_data:
